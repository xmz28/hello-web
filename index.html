<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的主页</title>
<link rel="stylesheet" href="style.css">
</head>

<body class="home-page">
<div class="site-bg" style="background-image: url('2.jpg');"></div>
<div class="site-overlay"></div>
<div id="particles-js"></div>

<main class="home-center">
    <section class="home-card">
        <div class="avatar-wrap">
            <img src="1.jpg" class="avatar" alt="头像">
        </div>

        <h1 class="home-title">小米周</h1>
        <p class="home-subtitle">一个会用 AI 做网站的人</p>

        <div class="button-row">
            <a href="home.html" class="btn">个人页</a>
            <a href="blog.html" class="btn">博客</a>
        </div>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
<script>
if (window.particlesJS) {
    particlesJS("particles-js", {
        particles: {
            number: { value: 60 },
            color: { value: "#ffffff" },
            opacity: { value: 0.3 },
            size: { value: 2 },
            move: { speed: 0.6 }
        }
    });
}
</script>
</body>
</html>
