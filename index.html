<!DOCTYPE html>
<html>
<head>
    <title>问候网页</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #e0e7ff, #f0f4ff);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            width: 300px;
        }

        input {
            width: 80%;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #ccc;
            outline: none;
            margin-top: 10px;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            background: #0071e3;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #005bb5;
        }

        h3 {
            margin-top: 20px;
            color: #333;
        }
    </style>
</head>

<body>

<div class="card">
    <h2>请输入你的名字</h2>
    <input type="text" id="nameInput">
    <br>
    <button onclick="sayHello()">继续</button>

    <h3 id="result"></h3>
</div>

<script>
    function sayHello() {
        var name = document.getElementById("nameInput").value;
        document.getElementById("result").innerText = "你好，" + name + "！";
    }
</script>

</body>
</html>
