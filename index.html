<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的主页</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: url("https://picsum.photos/1920/1080") no-repeat center/cover;
    font-family: -apple-system;
    overflow: hidden;
}

/* 暗色遮罩 */
.overlay {
    position: absolute;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
}

/* 中间内容 */
.center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: white;
}

/* 头像 */
.avatar {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    border: 3px solid #ff66cc;
    box-shadow: 0 0 20px #ff66cc;
}

/* 标题 */
h1 {
    margin: 15px 0;
    font-size: 40px;
}

/* 按钮 */
.buttons {
    margin-top: 30px;
}

.btn {
    display: inline-block;
    padding: 15px 25px;
    margin: 10px;
    border-radius: 15px;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    color: white;
    text-decoration: none;
    transition: 0.3s;
}

.btn:hover {
    background: rgba(255,255,255,0.3);
    transform: translateY(-5px);
}
</style>
</head>

<body>

<div class="overlay"></div>

<div class="center">
    <img src="https://i.pravatar.cc/100" class="avatar">
    <h1>你的名字</h1>
    <p>一个会用AI做网站的人</p>

<div class="buttons">
    <a href="home.html" class="btn">主页</a>
    <a href="blog.html" class="btn">博客</a>
</div>
</div>

</body>
</html>
