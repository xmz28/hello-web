<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>我的主页</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="remixicon.css">
</head>

<body class="home-page">
<div class="site-bg" style="background-image: url('2.jpg');"></div>
<div class="site-overlay"></div>
<div id="particles-js"></div>

<header class="home-status" aria-label="页面状态">
    <div class="home-status-item">
        <span class="status-dot" aria-hidden="true"></span>
        <span>FUJI DIGITAL SPACE</span>
    </div>
    <div class="home-status-item home-status-location">
        <i class="ri-map-pin-line" aria-hidden="true"></i>
        <span>ASIA / SHANGHAI</span>
    </div>
</header>

<main class="home-center" id="mainContent">
    <p class="home-eyebrow">WELCOME TO MY DIGITAL SPACE</p>

    <section class="home-dock" aria-label="个人主页入口">
        <div class="identity-panel">
            <div class="avatar-wrap">
                <img src="1.jpg" class="avatar" alt="小米周的头像">
                <span class="avatar-status" aria-label="在线"></span>
            </div>
            <div class="identity-copy">
                <h1 class="home-title">小米周</h1>
                <p class="home-subtitle">AI Builder <span>/</span> Web Explorer</p>
            </div>
        </div>

        <div class="time-widget" aria-label="北京时间">
            <span class="time-label">北京时间</span>
            <time id="beijingTime" class="pixel-time" datetime="">00:00:00</time>
            <span id="beijingDate" class="time-date">加载中...</span>
        </div>

        <nav class="home-nav" aria-label="主要导航">
            <a href="home.html" class="home-nav-link">
                <i class="ri-user-3-line" aria-hidden="true"></i>
                <span>个人页</span>
            </a>
            <a href="blog.html" class="home-nav-link">
                <i class="ri-article-line" aria-hidden="true"></i>
                <span>博客</span>
            </a>
            <a href="games.html" class="home-nav-link">
                <i class="ri-gamepad-line" aria-hidden="true"></i>
                <span>小游戏</span>
            </a>
            <a href="nav.html" class="home-nav-link">
                <i class="ri-compass-3-line" aria-hidden="true"></i>
                <span>网站导航</span>
            </a>
            <a href="dashboard.html" class="home-nav-link">
                <i class="ri-bar-chart-box-line" aria-hidden="true"></i>
                <span>状态面板</span>
            </a>
        </nav>

        <a href="https://github.com/xmz28/esp32-vehicle-dashboard"
           class="project-link"
           target="_blank"
           rel="noopener noreferrer"
           aria-label="查看 ESP32 项目，将在新标签页打开">
            <i class="ri-cpu-line" aria-hidden="true"></i>
            <span>ESP32 项目</span>
            <i class="ri-arrow-right-up-line project-arrow" aria-hidden="true"></i>
        </a>
    </section>

    <p class="home-hint"><span aria-hidden="true"></span> SELECT A DESTINATION</p>
</main>

<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
<script>
if (window.particlesJS) {
    particlesJS("particles-js", {
        particles: {
            number: { value: 30, density: { enable: true, value_area: 1100 } },
            color: { value: "#ffffff" },
            opacity: { value: 0.2 },
            size: { value: 1.6 },
            line_linked: {
                enable: true,
                distance: 145,
                color: "#d9f4ff",
                opacity: 0.1,
                width: 0.7
            },
            move: { speed: 0.35 }
        }
    });
}

const beijingTime = document.getElementById("beijingTime");
const beijingDate = document.getElementById("beijingDate");
const dateFormatter = new Intl.DateTimeFormat("zh-CN", {
    timeZone: "Asia/Shanghai",
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
    weekday: "long"
});
const timeFormatter = new Intl.DateTimeFormat("zh-CN", {
    timeZone: "Asia/Shanghai",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    hour12: false
});

function updateBeijingTime() {
    const now = new Date();
    beijingTime.textContent = timeFormatter.format(now);
    beijingTime.dateTime = now.toISOString();
    beijingDate.textContent = dateFormatter.format(now).replace(/\//g, ".");
}

updateBeijingTime();
setInterval(updateBeijingTime, 1000);

const homeDock = document.querySelector(".home-dock");
if (homeDock && window.matchMedia("(pointer: fine)").matches) {
    homeDock.addEventListener("pointermove", (event) => {
        const rect = homeDock.getBoundingClientRect();
        homeDock.style.setProperty("--pointer-x", `${event.clientX - rect.left}px`);
        homeDock.style.setProperty("--pointer-y", `${event.clientY - rect.top}px`);
    });
}
</script>
</body>
</html>
