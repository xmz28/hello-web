<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的博客</title>
<link rel="stylesheet" href="style.css">
</head>

<body class="blog-page">
<div class="site-bg" style="background-image: url('bbg.png');"></div>
<div class="site-overlay"></div>

<nav class="site-nav" aria-label="主导航">
    <img src="avatar.jpg" alt="头像">
    <a href="index.html">首页</a>
    <a href="home.html">个人页</a>
    <a href="blog.html" class="active">博客</a>
</nav>

<main class="blog-main">
    <section class="blog-hero">
        <h1>我的博客</h1>
        <p>记录技术、AI 与生活里的小发现</p>

        <div class="blog-tools">
            <input id="searchInput" class="search-input" type="search" placeholder="搜索文章标题、摘要或内容..." aria-label="搜索文章">

            <div class="tabs" role="tablist" aria-label="文章分类">
                <button class="tab active" type="button" data-category="全部">全部</button>
                <button class="tab" type="button" data-category="技术">技术</button>
                <button class="tab" type="button" data-category="AI">AI</button>
                <button class="tab" type="button" data-category="视频">视频</button>
                <button class="tab" type="button" data-category="生活">生活</button>
            </div>
        </div>
    </section>

    <section id="postGrid" class="post-grid" aria-label="文章列表"></section>
    <p id="emptyState" class="empty-state">没有找到匹配的文章，换个关键词试试。</p>
</main>

<div id="postModal" class="post-modal" role="dialog" aria-modal="true" aria-labelledby="postTitle">
    <article class="post-dialog">
        <img id="postImage" src="" alt="">
        <div class="post-detail-body">
            <div class="post-detail-top">
                <span id="postCategory" class="post-detail-category"></span>
                <button id="closePost" class="close-button" type="button" aria-label="关闭文章详情">×</button>
            </div>
            <h2 id="postTitle" class="post-detail-title"></h2>
            <div id="postMeta" class="post-detail-meta"></div>
            <div id="postContent" class="post-detail-content"></div>
            <a id="postLink" class="btn post-link" href="#" target="_blank" rel="noopener">去 B 站观看</a>
        </div>
    </article>
</div>

<script>
const posts = [
    {
        id: "first-post",

        summary: "这是我的第一篇博客，记录这个网站从想法到上线的过程。",
        category: "生活",
        date: "2026-04-29",
        views: 123,
        image: "https://picsum.photos/400/220?1",
        content: [
            "这篇文章像是给自己留的一张起点照片。页面还很简单，但它已经把我想表达的东西放在了一个可以被访问、被更新的地方。",
            "我希望这个博客以后不只是放作品，也能放一些学习过程：遇到的问题、解决的方法、走过的弯路，以及那些突然觉得“原来还能这样做”的瞬间。",
            "先从一个静态页面开始也很好。重要的不是第一版有多完整，而是它能不能让我愿意继续往里面写东西。"
        ]
    },
    {
        id: "ai-learning",
        title: "AI 学习记录",
        summary: "我开始用 AI 做网站了，也开始理解提示词和代码之间的关系。",
        category: "AI",
        date: "2026-04-28",
        views: 256,
        image: "https://picsum.photos/400/220?2",
        content: [
            "用 AI 做网页最大的感受是：它能很快给出一个看起来完整的版本，但真正让页面好用，还是要靠自己提出更具体的需求。",
            "比如导航、搜索、分类、移动端适配，这些细节一开始很容易被忽略。等页面真的打开使用时，才会发现“能看”和“能用”之间还有一段距离。",
            "接下来我想继续练习把想法拆成更清晰的功能点，让 AI 负责加速，我负责判断方向。"
        ]
    },
    {
        id: "japan-trip",
        title: "日本旅行",
        summary: "东京和富士山的旅行记录，整理一些值得保存的片段。",
        category: "生活",
        date: "2026-04-20",
        views: 512,
        image: "https://picsum.photos/400/220?3",
        content: [
            "旅行最有意思的地方，是很多画面在当时只是普通的一眼，回来以后却会变成记忆里很清楚的坐标。",
            "东京的街道、便利店的灯、富士山远远露出来的一角，都很适合写进博客。照片负责保存画面，文字负责保存当时的心情。",
            "以后这个分类可以继续放路线、预算、照片和踩坑记录，让每一次出发都有迹可循。"
        ]
    },
    {
        id: "front-end-notes",
        title: "前端小笔记：从静态页到可交互",
        summary: "给静态页面加一点 JavaScript，就能让博客开始真正回应用户。",
        category: "技术",
        date: "2026-04-18",
        views: 188,
        image: "https://picsum.photos/400/220?4",
        content: [
            "静态 HTML 很适合起步，因为它直接、稳定，也容易看懂。等结构清楚以后，再加入 JavaScript，就能逐步增加搜索、筛选、弹窗这样的交互。",
            "这次博客页的核心思路是把文章数据集中放在数组里，再根据关键词和分类重新渲染卡片。这样以后新增文章时，不需要复制一大段 HTML。",
            "当文章越来越多时，还可以继续升级成 JSON 数据、Markdown 文件，或者接入真正的后端。"
        ]
    },
    {
        id: "video-memory-upgrade",
        title: "如何只花100元左右把笔记本从16G内存升级到32G，2bg也升级到了4bg，性能提升多少？",
        summary: "一次笔记本内存升级记录，顺便看看升级前后的体验和性能变化。",
        category: "视频",
        date: "2024-06-27",
        views: 54519,
        image: "https://i1.hdslb.com/bfs/archive/b01b25ce5f5d90c42aa334408aa1cfb2596f90e0.jpg",
        url: "https://www.bilibili.com/video/BV1CM4m1m73R/",
        content: [
            "这个视频适合放在博客的技术/数码记录里：主题很具体，从预算、硬件选择到升级结果，都能让读者快速判断这件事值不值得做。",
            "博客里可以把它作为视频索引卡片展示，后续也能补一篇文字版：列出内存型号、升级步骤、注意事项和性能对比。",
            "点击下方按钮可以直接跳转到 B 站观看完整视频。"
        ]
    },
    {
        id: "video-android-aod",
        title: "安卓息屏显示和苹果全天候显示屏有啥区别",
        summary: "对比安卓息屏显示和苹果全天候显示屏，从体验角度聊差异。",
        category: "视频",
        date: "2024-12-16",
        views: 104277,
        image: "https://i0.hdslb.com/bfs/archive/50bcc5b1fe74c6ef6f2ae47f77bd6b5c6b2f9b12.jpg",
        url: "https://www.bilibili.com/video/BV1PDBNYZE9p/",
        content: [
            "这个视频的标题很适合作为博客里的数码观察入口：不是只讲参数，而是把两个系统的显示逻辑和日常使用感受放在一起比较。",
            "如果以后扩展成文章，可以补充亮度策略、功耗、通知展示、烧屏风险和不同品牌的实现方式。",
            "点击下方按钮可以直接跳转到 B 站观看完整视频。"
        ]
    },
    {
        id: "video-alipay-tap",
        title: "开箱支付宝碰一下，研究研究原理",
        summary: "围绕支付宝碰一下做开箱和原理探索，偏技术也偏生活观察。",
        category: "视频",
        date: "2024-12-07",
        views: 145832,
        image: "https://i1.hdslb.com/bfs/archive/a01b793bfed9d324ac36e54838226f8883e6ae67.jpg",
        url: "https://www.bilibili.com/video/BV1E9qLYkEjD/",
        content: [
            "这个选题很适合博客，因为它同时有开箱、体验和原理拆解三层内容。读者可以先看卡片了解主题，再跳到视频看完整过程。",
            "如果后续写文字版，可以把 NFC、支付入口、设备交互流程这些点拆开，会比单纯的视频标题更有长期阅读价值。",
            "点击下方按钮可以直接跳转到 B 站观看完整视频。"
        ]
    }
];

const postGrid = document.getElementById("postGrid");
const searchInput = document.getElementById("searchInput");
const tabs = document.querySelectorAll(".tab");
const emptyState = document.getElementById("emptyState");
const modal = document.getElementById("postModal");
const closePost = document.getElementById("closePost");
let activeCategory = "全部";

function renderPosts() {
    const keyword = searchInput.value.trim().toLowerCase();
    const filtered = posts.filter((post) => {
        const matchesCategory = activeCategory === "全部" || post.category === activeCategory;
        const haystack = [post.title, post.summary, post.category, post.date, post.url || "", ...post.content].join(" ").toLowerCase();
        return matchesCategory && haystack.includes(keyword);
    });

    postGrid.innerHTML = filtered.map((post) => `
        <button class="post-card" type="button" data-id="${post.id}">
            <span class="post-category">${post.category}</span>
            <img src="${post.image}" alt="${post.title}封面">
            <div class="post-content">
                <h2>${post.title}</h2>
                <p>${post.summary}</p>
                <div class="post-meta">
                    <span>${post.date}</span>
                    <span>浏览 ${post.views}</span>
                </div>
            </div>
        </button>
    `).join("");

    emptyState.classList.toggle("show", filtered.length === 0);
}

function openPost(postId) {
    const post = posts.find((item) => item.id === postId);
    if (!post) return;

    document.getElementById("postImage").src = post.image;
    document.getElementById("postImage").alt = `${post.title}封面`;
    document.getElementById("postCategory").textContent = post.category;
    document.getElementById("postTitle").textContent = post.title;
    document.getElementById("postMeta").textContent = `${post.date} · 浏览 ${post.views}`;
    document.getElementById("postContent").innerHTML = post.content.map((paragraph) => `<p>${paragraph}</p>`).join("");
    const postLink = document.getElementById("postLink");
    postLink.href = post.url || "#";
    postLink.hidden = !post.url;
    modal.classList.add("show");
    closePost.focus();
}

function closeModal() {
    modal.classList.remove("show");
}

tabs.forEach((tab) => {
    tab.addEventListener("click", () => {
        activeCategory = tab.dataset.category;
        tabs.forEach((item) => item.classList.remove("active"));
        tab.classList.add("active");
        renderPosts();
    });
});

searchInput.addEventListener("input", renderPosts);

postGrid.addEventListener("click", (event) => {
    const card = event.target.closest(".post-card");
    if (card) openPost(card.dataset.id);
});

closePost.addEventListener("click", closeModal);
modal.addEventListener("click", (event) => {
    if (event.target === modal) closeModal();
});

document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") closeModal();
});

renderPosts();
</script>
</body>
</html>
