const postGrid = document.getElementById("postGrid");
const featuredPost = document.getElementById("featuredPost");
const searchInput = document.getElementById("searchInput");
const tabs = document.querySelectorAll(".tab");
const emptyState = document.getElementById("emptyState");
const modal = document.getElementById("postModal");
const closePost = document.getElementById("closePost");
const mobileQrModal = document.getElementById("mobileQrModal");
let activeCategory = "全部";
let lastFocusedElement = null;

function pageText(key) {
    const lang = getStoredLang();
    return (blogLocales[lang] && blogLocales[lang][key]) || blogLocales["zh-CN"][key] || key;
}

function renderPosts() {
    const lang = getStoredLang();
    const keyword = searchInput.value.trim().toLowerCase();
    const filtered = posts.filter((post) => {
        const matchesCategory = activeCategory === "全部" || post.category === activeCategory;
        const haystack = [post.title, post.summary, post.category, post.date, post.url || "", ...post.content].join(" ").toLowerCase();
        return matchesCategory && haystack.includes(keyword);
    });
    const featured = filtered[0];

    if (featured) {
        featuredPost.hidden = false;
        featuredPost.innerHTML = `
            <button type="button" data-id="${featured.id}">
                <img src="${featured.image}" alt="${featured.title}封面" onerror="this.onerror=null;this.src='bg.jpg'">
                <span class="featured-shade" aria-hidden="true"></span>
                <span class="post-category">${categoryLabel(featured.category, lang)}</span>
                <span class="featured-copy">
                    <strong>${featured.title}</strong>
                    <em>${featured.summary}</em>
                    <small><i class="ri-calendar-line"></i>${featured.date}<i class="ri-eye-line"></i>${pageText("views")} ${featured.views}</small>
                </span>
                <span class="featured-index">01 / ${String(filtered.length).padStart(2, "0")}</span>
            </button>
        `;
    } else {
        featuredPost.hidden = true;
        featuredPost.innerHTML = "";
    }

    postGrid.innerHTML = filtered.slice(1).map((post) => `
        <button class="post-card" type="button" data-id="${post.id}">
            <span class="post-thumb">
                <img src="${post.image}" alt="${post.title}封面" onerror="this.onerror=null;this.src='bg.jpg'">
                <span class="post-category">${categoryLabel(post.category, lang)}</span>
            </span>
            <span class="post-content">
                <strong>${post.title}</strong>
                <em>${post.summary}</em>
                <small class="post-meta">
                    <span><i class="ri-calendar-line"></i>${post.date}</span>
                    <span><i class="ri-eye-line"></i>${pageText("views")} ${post.views}</span>
                </small>
            </span>
            <i class="ri-arrow-right-line post-arrow" aria-hidden="true"></i>
        </button>
    `).join("");

    emptyState.classList.toggle("show", filtered.length === 0);
    document.getElementById("postCount").textContent = String(posts.length).padStart(2, "0");
}

function openPost(postId) {
    const post = posts.find((item) => item.id === postId);
    if (!post) return;

    lastFocusedElement = document.activeElement;
    document.getElementById("postImage").src = post.image;
    document.getElementById("postImage").onerror = function() {
        this.onerror = null;
        this.src = "bg.jpg";
    };
    document.getElementById("postImage").alt = `${post.title}封面`;
    document.getElementById("postCategory").textContent = categoryLabel(post.category);
    document.getElementById("postTitle").textContent = post.title;
    document.getElementById("postMeta").textContent = `${post.date} · ${pageText("views")} ${post.views}`;
    document.getElementById("postContent").innerHTML = post.content.map((paragraph) => `<p>${paragraph}</p>`).join("");
    const postLink = document.getElementById("postLink");
    postLink.href = post.url || "#";
    postLink.hidden = !post.url;
    modal.classList.add("show");
    closePost.focus();
}

function closeModal() {
    modal.classList.remove("show");
    if (lastFocusedElement) lastFocusedElement.focus();
}

tabs.forEach((tab) => {
    tab.addEventListener("click", () => {
        activeCategory = tab.dataset.category;
        tabs.forEach((item) => item.classList.remove("active"));
        tab.classList.add("active");
        renderPosts();
    });
});

searchInput.addEventListener("input", renderPosts);

postGrid.addEventListener("click", (event) => {
    const card = event.target.closest(".post-card");
    if (card) openPost(card.dataset.id);
});

featuredPost.addEventListener("click", (event) => {
    const card = event.target.closest("[data-id]");
    if (card) openPost(card.dataset.id);
});

closePost.addEventListener("click", closeModal);
modal.addEventListener("click", (event) => {
    if (event.target === modal) closeModal();
});

document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") {
        if (modal.classList.contains("show")) closeModal();
        if (mobileQrModal.classList.contains("show")) closeMobileQR();
    }
    if (event.key === "/" && document.activeElement !== searchInput) {
        event.preventDefault();
        searchInput.focus();
    }
});

function showMobileQR() {
    lastFocusedElement = document.activeElement;
    mobileQrModal.classList.add("show");
    mobileQrModal.querySelector(".modal-close").focus();
}

function closeMobileQR() {
    mobileQrModal.classList.remove("show");
    if (lastFocusedElement) lastFocusedElement.focus();
}

mobileQrModal.addEventListener("click", (event) => {
    if (event.target === mobileQrModal || event.target.closest(".modal-close")) {
        closeMobileQR();
    }
});

setupSiteControls(blogLocales, () => {
    document.querySelectorAll("[data-category-label]").forEach((label) => {
        label.textContent = categoryLabel(label.closest(".tab").dataset.category);
    });
    renderPosts();
});

function syncBlogThemeIcon() {
    const themeButton = document.getElementById("themeToggle");
    if (!themeButton) return;
    const isDark = document.documentElement.dataset.theme === "dark";
    themeButton.innerHTML = `<i class="${isDark ? "ri-moon-line" : "ri-sun-line"}" aria-hidden="true"></i>`;
}

syncBlogThemeIcon();
document.getElementById("themeToggle")?.addEventListener("click", () => requestAnimationFrame(syncBlogThemeIcon));
</script>
</body>
</html>
