<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的博客</title>

<style>
body {
    margin: 0;
    font-family: -apple-system;
    background: linear-gradient(120deg,#f6d365,#fda085);
}

/* 顶部 */
.header {
    padding: 20px;
    text-align: center;
    color: white;
}

h1 {
    margin: 0;
}

/* 卡片布局 */
.container {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(250px,1fr));
    gap: 20px;
    padding: 20px;
}

/* 文章卡片 */
.card {
    background: white;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-5px);
}

/* 图片 */
.card img {
    width: 100%;
    height: 150px;
    object-fit: cover;
}

/* 内容 */
.card-content {
    padding: 15px;
}

.card-content h3 {
    margin: 0;
}

.card-content p {
    color: #666;
}
</style>
</head>

<body>

<div class="header">
    <h1>我的博客</h1>
    <p>记录技术与生活</p>
</div>

<div class="container">

<div class="card">
    <img src="https://picsum.photos/400/200">
    <div class="card-content">
        <h3>第一篇文章</h3>
        <p>这是我的第一篇博客</p>
    </div>
</div>

<div class="card">
    <img src="https://picsum.photos/401/200">
    <div class="card-content">
        <h3>AI学习记录</h3>
        <p>我开始用AI做网站了</p>
    </div>
</div>

<div class="card">
    <img src="https://picsum.photos/402/200">
    <div class="card-content">
        <h3>日本旅行</h3>
        <p>东京+富士山记录</p>
    </div>
</div>

</div>

</body>
</html>
