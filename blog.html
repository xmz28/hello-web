<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的博客</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont;
    height: 100vh;
    background: url("bbg.png") no-repeat center/cover;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* 整体容器（关键！） */
.wrapper {
    width: 100%;
    max-width: 1100px;
    text-align: center;
}

/* 遮罩层（让画面更柔） */
.overlay {
    position: fixed;
    inset: 0;
    background: linear-gradient(
        rgba(255,255,255,0.6),
        rgba(255,255,255,0.2)
    );
    backdrop-filter: blur(8px);
    z-index: -1;
}

/* 标题 */
.hero h1 {
    font-size: 40px;
    color: #fff;
}

.hero p {
    margin-top: 10px;
    color: rgba(255,255,255,0.9);
}

/* 搜索 */
.search {
    margin-top: 20px;
}

.search input {
    width: 320px;
    padding: 14px 20px;
    border-radius: 30px;
    border: none;
    outline: none;
}

/* 分类 */
.tabs {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-top: 20px;
}

.tab {
    padding: 8px 18px;
    border-radius: 20px;
    background: rgba(255,255,255,0.4);
    color: white;
    cursor: pointer;
    transition: 0.3s;
}

.tab:hover {
    background: #fff;
    color: #333;
}

/* 卡片区域（居中） */
.container {
    margin-top: 50px;
    display: flex;
    justify-content: center;
    gap: 25px;
    flex-wrap: wrap;
}

/* 卡片 */
.card {
    width: 260px;
    background: rgba(255,255,255,0.85);
    border-radius: 20px;
    overflow: hidden;
    backdrop-filter: blur(10px);
    transition: 0.4s;
}

.card:hover {
    transform: translateY(-10px) scale(1.03);
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
}

/* 图片 */
.card img {
    width: 100%;
    height: 150px;
    object-fit: cover;
}

/* 标签 */
.tag {
    position: absolute;
    top: 10px;
    left: 10px;
    background: rgba(0,0,0,0.5);
    color: white;
    padding: 4px 8px;
    border-radius: 8px;
    font-size: 12px;
}

/* 内容 */
.card-content {
    padding: 15px;
    text-align: left;
}

.card-content h3 {
    font-size: 16px;
}

.card-content p {
    color: #666;
    font-size: 14px;
    margin-top: 5px;
}

/* 信息 */
.meta {
    margin-top: 10px;
    font-size: 12px;
    color: #999;
    display: flex;
    justify-content: space-between;
}
</style>
</head>

<body>

<div class="overlay"></div>

<div class="wrapper">

    <!-- 顶部 -->
    <div class="hero">
        <h1>我的博客</h1>
        <p>记录技术与生活</p>

        <div class="search">
            <input placeholder="搜索文章..." />
        </div>

        <div class="tabs">
            <div class="tab">全部</div>
            <div class="tab">技术</div>
            <div class="tab">AI</div>
            <div class="tab">生活</div>
        </div>
    </div>

    <!-- 卡片 -->
    <div class="container">

        <div class="card">
            <img src="https://picsum.photos/400/200?1">
            <div class="card-content">
                <h3>第一篇文章</h3>
                <p>这是我的第一篇博客</p>
                <div class="meta">
                    <span>2026-04-29</span>
                    <span>👁 123</span>
                </div>
            </div>
        </div>

        <div class="card">
            <img src="https://picsum.photos/400/200?2">
            <div class="card-content">
                <h3>AI学习记录</h3>
                <p>我开始用AI做网站了</p>
                <div class="meta">
                    <span>2026-04-28</span>
                    <span>👁 256</span>
                </div>
            </div>
        </div>

        <div class="card">
            <img src="https://picsum.photos/400/200?3">
            <div class="card-content">
                <h3>日本旅行</h3>
                <p>东京+富士山记录</p>
                <div class="meta">
                    <span>2026-04-20</span>
                    <span>👁 512</span>
                </div>
            </div>
        </div>

    </div>

</div>

</body>
</html>
