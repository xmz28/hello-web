<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>终端控制台</title>
<script src="theme-init.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="remixicon.css">
</head>
<body class="terminal-page">
<a class="skip-link" href="#mainContent">跳到主内容</a>
<div class="site-bg" style="background-image: url('assets/images/2.jpg');"></div>
<div class="site-overlay"></div>
<main id="mainContent" tabindex="-1" class="terminal-main">
    <section class="terminal-window">
        <header><span></span><span></span><span></span><strong>XMZ Terminal</strong><a href="dashboard.html">返回状态面板</a><div class="nav-controls">
        <div class="lang-menu">
            <button id="langToggle" aria-controls="languageOptions" aria-expanded="false" class="icon-toggle" type="button" aria-label="语言"><i class="ri-translate-2"></i></button>
            <div id="languageOptions" class="lang-panel" hidden>
                <button type="button" data-lang-option="zh-CN"><span class="flag-emoji">🇨🇳</span>简体中文</button>
                <button type="button" data-lang-option="zh-TW"><span class="flag-emoji">🇭🇰</span>繁體中文</button>
                <button type="button" data-lang-option="en"><span class="flag-emoji">🇺🇸</span>English</button>
                <button type="button" data-lang-option="ja"><span class="flag-emoji">🇯🇵</span>日本語</button>
            </div>
        </div>
        <button id="themeToggle" class="icon-toggle" type="button" aria-label="主题" data-icon-ui="remix"><i class="ri-sun-line"></i></button>
</div>
</header>
        <div id="terminalOutput" class="terminal-output"></div>
        <label class="terminal-input"><span>$</span><input id="terminalInput" aria-label="终端命令" autocomplete="off" spellcheck="false"></label>
    </section>
</main>
<script src="interface-copy.js"></script>
<script src="site.js"></script>
<script src="site-widgets.js"></script>
<script>setupSiteControls(); setupTerminalPage("terminal");</script>
</body>
</html>
