setupSiteControls(homeLocales);

const uptimeStart = new Date("2026-04-29T13:20:00+08:00").getTime();
const uptimeCounter = document.getElementById("uptimeCounter");

function updateUptime() {
    const diff = Math.max(0, Date.now() - uptimeStart);
    const days = Math.floor(diff / 86400000);
    const hours = Math.floor(diff / 3600000) % 24;
    const minutes = Math.floor(diff / 60000) % 60;
    const seconds = Math.floor(diff / 1000) % 60;
    uptimeCounter.textContent = `${days}天 ${hours}时 ${minutes}分 ${seconds}秒`;
}

updateUptime();
setInterval(updateUptime, 1000);

function showBili() {
    document.getElementById("biliModal").classList.add("show");
}

function showDouyin() {
    document.getElementById("douyinModal").classList.add("show");
}

document.querySelectorAll(".qr-modal").forEach(function(modal) {
    modal.addEventListener("click", function(event) {
        if (event.target === modal) {
            modal.classList.remove("show");
        }
    });
});

document.addEventListener("keydown", function(event) {
    if (event.key === "Escape") {
        document.querySelectorAll(".qr-modal").forEach(function(modal) {
            modal.classList.remove("show");
        });
    }
});
</script>
