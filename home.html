<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人简介</title>
<link rel="stylesheet" href="style.css">
</head>

<body class="profile-page">
<div class="site-bg" style="background-image: url('bg.jpg');"></div>
<div class="site-overlay"></div>

<nav class="site-nav" aria-label="主导航">
    <img src="1.jpg" alt="头像">
    <a href="index.html">首页</a>
    <a href="home.html" class="active">个人页</a>
    <a href="blog.html">博客</a>
</nav>

<main class="profile-main">
    <section class="profile-left">
        <img src="1.jpg" class="profile-avatar" alt="个人头像">
        <div class="profile-name">小米周</div>
        <div class="profile-tagline">探索世界与技术边界</div>
    </section>

    <section class="profile-panel">
        <h1>关于我</h1>
        <p>喜欢数码、旅行、摄影，也会折腾各种有意思的东西。</p>

        <div class="tag-list">
            <span class="tag-pill">数码</span>
            <span class="tag-pill">旅行</span>
            <span class="tag-pill">摄影</span>
            <span class="tag-pill">折腾</span>
        </div>

        <div class="button-row">
            <a href="blog.html" class="btn">博客</a>
            <button class="btn" type="button" onclick="showBili()">B站</button>
            <button class="btn" type="button" onclick="showDouyin()">抖音</button>
        </div>
    </section>
</main>

<div id="biliModal" class="qr-modal" role="dialog" aria-modal="true" aria-label="B站介绍">
    <div class="qr-box social-box">
        <h2>B站：小米周_bili</h2>
        <p>这里会更新数码体验、折腾记录和一些轻技术向的视频内容。想看完整视频合集，可以从这里跳到我的 B 站主页。</p>
        <a class="btn social-link" href="https://space.bilibili.com/338302827" target="_blank" rel="noopener">前往 B站主页</a>
    </div>
</div>

<div id="douyinModal" class="qr-modal" role="dialog" aria-modal="true" aria-label="抖音介绍">
    <div class="qr-box social-box">
        <h2>抖音：小米周</h2>
        <p>抖音会放更短、更直接的日常分享和视频片段。可以扫码关注，也可以点击底部按钮跳转。</p>
        <img src="douyin.png" alt="抖音二维码">
        <a class="btn social-link" href="https://v.douyin.com/x64M2NbYj0A/" target="_blank" rel="noopener">前往抖音主页</a>
    </div>
</div>

<script>
function showBili() {
    document.getElementById("biliModal").classList.add("show");
}

function showDouyin() {
    document.getElementById("douyinModal").classList.add("show");
}

document.querySelectorAll(".qr-modal").forEach(function(modal) {
    modal.addEventListener("click", function(event) {
        if (event.target === modal) {
            modal.classList.remove("show");
        }
    });
});

document.addEventListener("keydown", function(event) {
    if (event.key === "Escape") {
        document.querySelectorAll(".qr-modal").forEach(function(modal) {
            modal.classList.remove("show");
        });
    }
});
</script>
</body>
</html>
